name: Swift CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Package source artifact
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: generator-source
          path: dist/generator-source-v*.zip
