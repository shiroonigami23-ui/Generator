name: Generator Sync
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Inject Environment Variables
        run: |
          sed -i "s/GENERATOR_AI_KEY_PLACEHOLDER/${{ secrets.GENERATOR_AI_KEY }}/g" ai.js
          sed -i "s/GENERATOR_FB_KEY_PLACEHOLDER/${{ secrets.GENERATOR_FB_KEY }}/g" firebase.js
      - name: Deploy to Production
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages
          